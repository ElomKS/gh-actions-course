name: 07 - Expressions
run-name: 07 - Using Expressions | DEBUG - ${{ inputs.debug && 'ON' || 'OFF' }}

on:
    push:
    workflow_dispatch:
        inputs:
            debug:
                type: boolean
                default: false

jobs:
    echo-data:
        runs-on: ubuntu-latest
        steps:
            - name: "[debug] Print start-up information"
              if: ${{ inputs.debug }}
              run: |
                echo "Debug mode is enabled by : ${{ github.event_name}}"
                echo "Branch: ${{ github.ref }}"
                echo "Commit SHA: ${{ github.sha }}"
                echo "Runner OS: ${{ runner.os }}"
            - name: "[debug] Print with triggered from main"
              if: ${{ inputs.debug && github.ref == 'refs/heads/main' }}
              run: echo "Triggered from main branch"
            - name: Greeting
              run: echo "Hello, world"
                    
