name: 13 - Using Caching

on:
  workflow_dispatch:
        inputs:
          use-cache:
            description: Whether to execute cache step
            type: boolean
            default: true
          node-version:
            description: Node version
            type: choice
            options:
                - 18.x
                - 20.x
                - 22.x
            default: 20.x

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 13-caching/react-app
        steps: 
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Seting up Node
              uses: actions/setup-node@v3
              with:
                node-version: 20.x
            - name: Install dependencies
              run: npm ci
            - name: Testing
              run: npm run test
            - name: Build
              run: npm run build
            - name: Deploy
              run: echo "Deploying to non prod environment"
