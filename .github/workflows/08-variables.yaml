name: 08 - using variables

on:
    push:
    workflow_dispatch:
env:
    WORKFLOW_VAR: 'I am a workflow env variable'
    OVERWRITTEN_VAR: 'I am an overwritten workflow env variable'
jobs:
    echo:
      runs-on: ubuntu-latest
      env:
        JOB_VAR: 'I am a job env variable'
        # OVERWRITTEN_VAR: 'I have been overwritten at thejob level'
      steps:
          - name: Print env variables
            env:
                STEP_VAR: 'I am a step variable'
                step_var2: 'I am another step variable'
            run: |
                echo "Workflow variable: ${{ env.STEP_VAR }}"
                echo "Step variable 2: $step_var2"
                echo "Job variable: ${{ env.JOB_VAR }}"
                echo "Workflow variable: ${{ env.WORKFLOW_VAR }}"

          - name: Overwrite job variable
            # env:
            #     OVERWRITTEN_VAR: 'I have been overwritten at the step level'
            run: |
                echo "Step env var: ${{ env.OVERWRITTEN_VAR }}"